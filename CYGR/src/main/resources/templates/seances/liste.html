<!DOCTYPE html>
<html lang="fr" xmlns:th="https://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste des séances</title>
</head>
<body>
    <h1>Séances</h1>

    <p th:if="${seances.isEmpty()}">Aucune séance disponible pour le moment</p>

    <div th:each="seance : ${seances}">
        <h2 th:text="${seance.film.nom}">Nom du film</h2>
        <p>Date : <span th:text="${#temporals.format(seance.dateHeureDebut, 'dd/MM/yyyy HH:mm')}">01/01/2026 20:30</span></p>
        <p>Salle : <span th:text="${seance.salle.nom}">Salle 1</span></p>
        <p>Version : <span th:text="${seance.version}">VF</span></p>
        <p>Prix : <span th:text="${seance.prix}">10</span> €</p>
    </div>

</body>
</html>
