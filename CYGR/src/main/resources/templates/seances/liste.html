<!DOCTYPE html>
<html lang="fr" xmlns:th="https://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste des séances</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header th:replace="~{fragments/header :: header}"></header>

    <main class="container page">
        <div class="page-head">
            <h1>Séances</h1>
            <div class="actions">
                <a th:href="@{/seances/nouvelle}" class="btn btn-primary">Ajouter une séance</a>
            </div>
        </div>

        <p class="message succes" th:if="${succes}" th:text="${succes}"></p>
        <p class="message erreur" th:if="${erreur}" th:text="${erreur}"></p>

        <p class="vide" th:if="${seances.isEmpty()}">Aucune séance disponible pour le moment</p>

        <table class="tableau" th:unless="${seances.isEmpty()}">
            <tr>
                <th>Date</th><th>Film</th><th>Salle</th><th>Version</th><th>Prix</th>
            </tr>
            <tr th:each="seance : ${seances}">
                <td th:text="${#temporals.format(seance.dateHeureDebut, 'dd/MM/yyyy HH:mm')}">01/01/2026 20:30</td>
                <td th:text="${seance.film.nom}">Nom du film</td>
                <td th:text="${seance.salle.nom}">Salle 1</td>
                <td th:text="${seance.version}">VF</td>
                <td th:text="${seance.prix} + ' €'">10 €</td>
            </tr>
        </table>
    </main>
</body>
</html>
