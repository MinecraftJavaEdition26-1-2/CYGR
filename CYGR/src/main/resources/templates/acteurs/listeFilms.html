<!DOCTYPE html>
<html lang="fr" xmlns:th="https://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste des acteurs</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header th:replace="~{fragments/header :: header}"></header>
    <p th:if="${films.isEmpty()}">Cette acteur n'a joué dans aucun film</p>

    <p>Liste des films de <span th:text="${acteur.nom}"></span></p>

    <div>
        <div th:each="film : ${films}">
            <div class="film">
                <div class="affiche">
                    <img th:src="${film.affiche}" th:alt="${film.nom}">
                </div>

                <div class="film-infos">
                    <div>
                        <h1 th:text="${film.nom}">Nom du film</h1>
                        <div class="film-meta">
                            <span><span th:text="${film.anneeSortie}">2010</span> · <span th:text="${film.duree}">148</span> min</span>
                            <span class="age"><span th:text="${film.age}">12</span>+</span>
                        </div>
                    </div>

                    <p class="synopsis" th:text="${film.synopsis}">Synopsis du film</p>

                    <div class="actions">
                        <a th:href="@{/films/detail(id=${film.id})}" class="btn btn-primary">Voir le détail</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
