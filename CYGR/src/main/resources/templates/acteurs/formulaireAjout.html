<!DOCTYPE html>
<html lang="fr" xmlns:th="https://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajouter un acteur</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header th:replace="~{fragments/header :: header}"></header>

    <main class="container page">
        <a th:href="@{/acteurs}" class="retour">← Retour à la liste des acteurs</a>

        <div class="page-head">
            <h1>Ajouter un acteur</h1>
        </div>

        <form class="formulaire" th:action="@{/acteurs/enregistrer}" th:object="${acteur}" method="post">
            <div class="champ">
                <label>Nom</label>
                <input type="text" required th:field="*{nom}">
            </div>
            <div class="champ">
                <label>Prénom</label>
                <input type="text" required th:field="*{prenom}">
            </div>
            <div class="champ">
                <label>Nationalité</label>
                <input type="text" required th:field="*{nationalite}">
            </div>
            <div class="actions">
                <button type="submit" class="btn btn-primary">Enregistrer l'acteur</button>
            </div>
        </form>
    </main>
</body>
</html>
