<!DOCTYPE html>
<html lang="fr" xmlns:th="https://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste des films</title>
</head>
<body>
    <h1>Acteurs</h1>

    <p th:if="${acteurs.isEmpty()}">Aucun film disponible pour le moment</p>

    <div th:each="acteur : ${acteurs}">
        <h2 th:text="${acteur.nom + ' ' + acteur.prenom}">Nom de l'acteur</h2>
        <p>Nationalité : <span th:text="${acteur.nationalite}"></span> </p>
    </div>


</body>
</html>
