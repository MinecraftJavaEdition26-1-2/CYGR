<!DOCTYPE html>
<html lang="fr" xmlns:th="https://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste des acteurs</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header th:replace="~{fragments/header :: header}"></header>

    <main class="container page">
        <div class="page-head">
            <h1>Acteurs</h1>
            <div class="actions">
                <a th:href="@{/acteurs/formulaireModifier}" class="btn">Modifier un acteur</a>
                <a th:href="@{/acteurs/formulaireSupprimer}" class="btn">Supprimer un acteur</a>
                <a th:href="@{/acteurs/nouveau}" class="btn btn-primary">Ajouter un acteur</a>
            </div>
        </div>

        <div th:replace="~{fragments/messages :: messages}"></div>

        <p class="vide" th:if="${acteurs.isEmpty()}">Aucun acteur disponible pour le moment</p>

        <div class="lignes" th:unless="${acteurs.isEmpty()}">
            <div class="ligne" th:each="acteur : ${acteurs}">
                <div class="ligne-texte">
                    <a class="ligne-titre" th:href="@{/acteurs/voirFilms(id=${acteur.id})}"
                       th:text="${acteur.prenom + ' ' + acteur.nom}">Prénom Nom</a>
                    <span class="ligne-meta">
                        <span th:text="${acteur.nationalite}">Nationalité</span>
                        · <span th:text="${acteur.films.size()}">0</span> film(s)
                    </span>
                </div>
                <a th:href="@{/acteurs/voirFilms(id=${acteur.id})}" class="btn">Voir ses films</a>
            </div>
        </div>
    </main>
</body>
</html>
