<!DOCTYPE html>
<html lang="fr" xmlns:th="https://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste des acteurs</title>
</head>
<body>
    <h1>Acteurs</h1>

    <a th:href="@{/acteurs/nouveau}">Ajouter un acteur</a>
    <br>
    <a th:href="@{/acteurs/formulaireSupprimer}">Supprimer un acteur</a>
    <br>
    <a th:href="@{/acteurs/formulaireModifier}">Modifier un acteur</a>

    <p th:if="${acteurs.isEmpty()}">Aucun acteur disponible pour le moment</p>

    <div th:each="acteur : ${acteurs}">
        <h2>Nom et Prénom :     <span th:text="${acteur.nom + ' ' + acteur.prenom}"></span></h2>
        <p>Nationalité : <span th:text="${acteur.nationalite}"></span> </p>
    </div>


</body>
</html>
