<!DOCTYPE html>
<html lang="fr" xmlns:th="https://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifier un acteur</title>
</head>
<body>
    <h1>Page pour modifier les acteurs</h1>

    <a th:href="@{/acteurs}">Retour sur la liste des acteurs</a>

    <p th:if="${acteurs.isEmpty()}">Aucun acteur à modifier</p>

    <form th:action="@{/acteurs/modifierActeur}" th:each="acteur : ${acteurs}" method="get">
        <div>
            <input type="hidden" name="id" th:value="${acteur.id}">
            <h2 th:text="${acteur.nom + ' ' + acteur.prenom}"></h2>
            <p>Nationalité : <span th:text="${acteur.nationalite}"></span></p>
            <button type="submit">Modifier cet acteur</button>
        </div>
    </form>

</body>
</html>
