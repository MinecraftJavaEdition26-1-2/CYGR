<!DOCTYPE html>
<html lang="fr" xmlns:th="https://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYGR</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header th:replace="~{fragments/header :: header}"></header>

    <main class="container accueil">
        <h1>CYGR</h1>
        <p th:text="${message}">placeholder</p>
        <div class="actions">
            <a th:href="@{/films}" class="btn btn-primary">Voir les films</a>
            <a th:href="@{/acteurs}" class="btn">Voir les acteurs</a>
        </div>

        <p class="vide" th:if="${films.isEmpty()}">Aucun film à l'affiche pour le moment</p>
        <p>Film à l'affiche </p>
        <div class="grille-films">
            <a class="fiche" th:each="film : ${films}" th:href="@{/films/detail(id=${film.id})}">
                <div class="affiche">
                    <img th:src="${film.affiche}" th:alt="${film.nom}">
                </div>
                <div class="fiche-corps">
                    <h2 class="fiche-titre" th:text="${film.nom}">Nom du film</h2>
                </div>
            </a>
        </div>
    </main>
</body>
</html>
