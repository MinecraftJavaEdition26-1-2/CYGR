<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifier Film</title>
</head>
<body>
    <h1>Page pour modifier les films</h1>

    <form th:action="@{/films/modifierFilm}" th:each="film : ${films}" method="get">
        <div>
            <input type="hidden" name="id" th:value="${film.id}">
            <h2 th:text="${film.nom}"></h2>
            <img th:src="${film.affiche}" th:alt="${film.nom}">
            <p>Synopsis : <span th:text="${film.synopsis}"></span></p>
            <p>Age minimum : <span th:text="${film.age}"></span> ans</p>
            <p>Durée du film : <span th:text="${film.duree}"></span> minutes</p>
            <button type="submit">Modifier ce film</button>
        </div>
    </form>

</body>
</html>
