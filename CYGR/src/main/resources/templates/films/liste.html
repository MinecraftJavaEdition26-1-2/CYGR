<!DOCTYPE html>
<html lang="fr" xmlns:th="https://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste des films</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header th:replace="~{fragments/header :: header}"></header>

    <main class="container page">
        <div class="page-head">
            <h1>Films</h1>
            <div class="actions">
                <a th:href="@{/films/formulaireModifier}" class="btn">Modifier un film</a>
                <a th:href="@{/films/formulaireSupprimer}" class="btn">Supprimer un film</a>
                <a th:href="@{/films/nouveau}" class="btn btn-primary">Ajouter un film</a>
            </div>
        </div>

        <p class="vide" th:if="${films.isEmpty()}">Aucun film disponible pour le moment</p>

        <div class="grille-films">
            <a class="fiche" th:each="film : ${films}" th:href="@{/films/detail(id=${film.id})}">
                <div class="affiche">
                    <img th:src="${film.affiche}" th:alt="${film.nom}">
                </div>
                <div class="fiche-corps">
                    <h2 class="fiche-titre" th:text="${film.nom}">Nom du film</h2>
                    <div class="fiche-meta">
                        <span><span th:text="${film.anneeSortie}">2010</span> · <span th:text="${film.duree}">148</span> min</span>
                        <span class="age"><span th:text="${film.age}">12</span>+</span>
                    </div>
                </div>
            </a>
        </div>
    </main>
</body>
</html>
