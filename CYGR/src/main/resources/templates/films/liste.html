<!DOCTYPE html>
<html lang="fr" xmlns:th="https://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste des films</title>
</head>
<body>
    <h1>Film</h1>

    <p th:if="${films.isEmpty()}">Aucun film disponible pour le moment</p>

    <a th:href="@{/films/nouveau}" class="btn btn-primary">Ajouter un film</a>
    <br>
    <a th:href="@{/films/formulaireSupprimer}" class="btn btn-primary">Supprimer un film</a>

    <div th:each="film : ${films}">
        <h2 th:text="${film.nom}">Nom du film</h2>
        <img th:src="${film.affiche}" th:alt="${film.nom}" width="200">
        <p>Année de sortie : <span th:text="${film.anneeSortie}">2000</span></p>
        <p>Durée : <span th:text="${film.duree}">120</span> min</p>
        <p>Âge minimum : <span th:text="${film.age}">12</span> ans</p>
        <p th:text="${film.synopsis}">Synopsis du film</p>
    </div>


</body>
</html>
