<!DOCTYPE html>
<html lang="fr" xmlns:th="https://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste des clients</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header th:replace="~{fragments/header :: header}"></header>

    <main class="container page">
        <div class="page-head">
            <h1>Clients</h1>
            <div class="actions">
                <a th:href="@{/clients/nouveau}" class="btn btn-primary">Ajouter un client</a>
            </div>
        </div>

        <div th:replace="~{fragments/messages :: messages}"></div>

        <form class="recherche" th:action="@{/clients}" method="get">
            <input type="text" name="recherche" th:value="${recherche}" placeholder="Nom ou email">
            <button type="submit" class="btn">Rechercher</button>
            <a th:href="@{/clients}" class="btn">Effacer</a>
        </form>

        <p class="vide" th:if="${clients.isEmpty()}">Aucun client pour le moment</p>

        <div class="lignes">
            <div class="ligne" th:each="client : ${clients}">
                <div class="ligne-texte">
                    <a class="ligne-titre" th:href="@{/clients/{id}(id=${client.id})}" th:text="${client.prenom + ' ' + client.nom}"></a>
                    <span class="ligne-meta"><span th:text="${client.email}"></span> · né(e) le <span th:text="${#temporals.format(client.dateNaissance, 'dd/MM/yyyy')}"></span></span>
                </div>
                <span class="age" th:if="${client.etudiant}">Étudiant</span>
                <a th:href="@{/clients/{id}/modifier(id=${client.id})}" class="btn">Modifier</a>
                <form th:action="@{/clients/{id}/supprimer(id=${client.id})}" method="post"
                      onsubmit="return confirm('Supprimer ce client ?')">
                    <button type="submit" class="btn btn-danger">Supprimer</button>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
